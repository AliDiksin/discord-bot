name: bot
# Tests the Bub bot in bot/ (Python) with the pinned packages in bot/requirements-render.txt.
on:
  push:
    branches: [main]
    paths: ['bot/**', '.github/workflows/bot.yml']
  pull_request:
    paths: ['bot/**', '.github/workflows/bot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bot/requirements-render.txt
      - run: pip install -r bot/requirements-render.txt
      - name: Test the frame-data renderer and the SF Stats link
        working-directory: bot
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -t tests -p 'test_render_server.py' -v
          python -m unittest discover -s tests -t tests -p 'test_render_service.py' -v
          python -m unittest discover -s tests -t tests -p 'test_sfstats_messages.py'
          python -m unittest discover -s tests -t tests -p 'test_sfstats_bridge.py'
          python -m unittest discover -s tests -t tests -p 'test_decisions_layers.py' -v
          python -m unittest discover -s tests -t tests -p 'test_glossary_questions.py' -v
          python -m unittest discover -s tests -t tests -p 'test_frame_rankings.py' -v
          python -m unittest discover -s tests -t tests -p 'test_hitbox_links.py' -v
